<!-- FORMULAIRE DE CONTACT INTERACTIF AVEC EMAILJS -->
<!-- À ajouter dans index.html à la place de la section contact existante -->

<section class="contact section" id="contact">
    <div class="container">
        <div class="contact-box">
            <div class="contact-info">
                <p class="eyebrow eyebrow-dark">Contact</p>
                <h2>Travaillons ensemble pour créer l'avenir.</h2>

                <div class="contact-list">
                    <a href="tel:+2250564159823" class="contact-item">
                        <span>📞</span>
                        <div>
                            <small>Téléphone</small>
                            <strong>+225 0564159823</strong>
                        </div>
                    </a>

                    <a href="mailto:tuowanna.achille@gmail.com" class="contact-item">
                        <span>✉️</span>
                        <div>
                            <small>E-mail</small>
                            <strong>tuowannaachille@gmail.com</strong>
                        </div>
                    </a>

                    <div class="contact-item">
                        <span>📍</span>
                        <div>
                            <small>Localisation</small>
                            <strong>Bouaké, Côte d'Ivoire</strong>
                        </div>
                    </div>
                </div>
            </div>

            <!-- FORMULAIRE DE CONTACT -->
            <form id="contactForm" class="contact-form">
                <div class="form-group">
                    <label for="name">Nom complet *</label>
                    <input 
                        type="text" 
                        id="name" 
                        name="name" 
                        required
                        placeholder="Votre nom"
                        aria-label="Nom complet"
                    />
                </div>

                <div class="form-group">
                    <label for="email">Adresse email *</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        required
                        placeholder="votre.email@exemple.com"
                        aria-label="Adresse email"
                    />
                </div>

                <div class="form-group">
                    <label for="subject">Sujet *</label>
                    <input 
                        type="text" 
                        id="subject" 
                        name="subject" 
                        required
                        placeholder="Sujet de votre message"
                        aria-label="Sujet"
                    />
                </div>

                <div class="form-group">
                    <label for="message">Message *</label>
                    <textarea 
                        id="message" 
                        name="message" 
                        rows="5" 
                        required
                        placeholder="Votre message..."
                        aria-label="Message"
                    ></textarea>
                </div>

                <!-- MESSAGE D'ERREUR/SUCCÈS -->
                <div id="formMessage" class="form-message" style="display: none;"></div>

                <!-- BOUTON ENVOYER -->
                <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
                    <span>Envoyer le message</span>
                    <span class="loading" style="display: none;">⏳ Envoi...</span>
                </button>
            </form>

            <!-- ACTIONS ALTERNATIFS -->
            <div class="contact-actions">
                <a href="tel:+2250564159823" class="btn btn-primary btn-block">Appeler</a>
                <a href="mailto:tuowanna.achille@gmail.com" class="btn btn-secondary btn-block">
                    Écrire un mail
                </a>
                <button type="button" class="btn btn-light btn-block" id="copyEmailBtn">
                    Copier l'e-mail
                </button>
            </div>
        </div>
    </div>
</section>
